
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phainon's Vinyl ♡</title>

<style>
:root {
  --blue: #8DB1DA;
  --dark-blue: #344C69;
  --ink: #172331;
  --light: #F0F5FB;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--blue);
}

.widget {
  width: 360px;
  max-width: 100%;
  padding: 24px;
  border: 1px solid rgba(255,255,255,.8);
  border-radius: 25px;
  background: var(--light);
  box-shadow: 0 18px 50px #344C6930;
  text-align: center;
}

.eyebrow {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 3px;
  color: var(--dark-blue);
}

h1 {
  margin: 8px 0 5px;
  font-family: Georgia, serif;
  font-size: 27px;
  font-weight: normal;
}

.subtitle {
  margin: 0 0 23px;
  color: #63758B;
  font-size: 12px;
}

.turntable {
  width: 235px;
  height: 235px;
  margin: 0 auto 23px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #D7E5F4;
  box-shadow: inset 0 0 0 1px white;
}

.vinyl {
  position: relative;
  width: 215px;
  height: 215px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: repeating-radial-gradient(
    circle,
    #222832 0px,
    #222832 2px,
    #343A45 3px,
    #171B23 4px,
    #222832 6px
  );
  box-shadow: 0 5px 12px #17233145,
              inset 0 0 0 2px #111720;
}

.vinyl::before,
.vinyl::after {
  content: "";
  position: absolute;
  border: 1px solid #FFFFFF17;
  border-radius: 50%;
}

.vinyl::before { inset: 8px; }
.vinyl::after { inset: 17px; }

.vinyl.spinning {
  animation: spin 3s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.label {
  z-index: 1;
  position: relative;
  width: 100px;
  height: 100px;
  overflow: hidden;
  border: 4px solid var(--blue);
  border-radius: 50%;
  background: var(--blue);
  box-shadow: 0 0 0 3px #171B23;
}

.label img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.hole {
  position: absolute;
  z-index: 3;
  top: 50%;
  left: 50%;
  width: 7px;
  height: 7px;
  transform: translate(-50%, -50%);
  border: 1px solid #C9D5E3;
  border-radius: 50%;
  background: #171B23;
}

.track {
  margin: 0 auto 15px;
}

.track-name {
  font-size: 17px;
  font-weight: 700;
}

.artist {
  margin-top: 5px;
  color: #718198;
  font-size: 12px;
}

.status {
  margin: 15px 0;
  color: #647B96;
  font-size: 11px;
  line-height: 1.5;
}

button {
  width: 100%;
  padding: 12px 16px;
  border: 0;
  border-radius: 12px;
  background: var(--blue);
  color: #182A3E;
  font: inherit;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}

button:hover { filter: brightness(.96); }

.playlist {
  margin-top: 22px;
  overflow: hidden;
  border-radius: 14px;
  text-align: left;
}

.playlist-heading {
  margin: 0 0 10px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1.5px;
  color: var(--dark-blue);
  text-align: center;
}

iframe {
  display: block;
  width: 100%;
  height: 352px;
  border: 0;
  border-radius: 12px;
}

.note {
  margin-top: 12px;
  color: #718198;
  font-size: 10px;
  line-height: 1.5;
}

.footer {
  margin-top: 17px;
  color: #94A3B6;
  font-size: 9px;
  letter-spacing: 2px;
}
</style>
</head>

<body>
<main class="widget">

  <div class="eyebrow">YOUR PERSONAL SOUNDTRACK</div>
  <h1>Phainon's Vinyl</h1>
  <p class="subtitle">a little record just for you ♡</p>

  <div class="turntable">
    <div class="vinyl" id="vinyl">
      <div class="label">
        <img
          src="./‧₊˚ ☀️ ‧₊𓏲 ๋࣭ ࣪ ˖.jpeg"
          alt="Phainon"
          onerror="this.style.display='none'"
        >
      </div>
      <div class="hole"></div>
    </div>
  </div>

  <div class="track">
    <div class="track-name">Your playlist awaits ♫</div>
    <div class="artist">Choose a song below to listen</div>
  </div>

  <div class="status" id="status">
    ♡ Your playlist, your soundtrack
  </div>

  <button id="spinButton" type="button">
    SPIN THE VINYL ♫
  </button>

  <section class="playlist">
    <p class="playlist-heading">RUBY'S PLAYLIST</p>

    <iframe
      id="spotifyPlaylist"
      title="Ruby's Spotify playlist"
      src="https://open.spotify.com/embed/playlist/63IT8BaygT68DeLu2Du8Ws?theme=0"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>
  </section>

  <p class="note">
    Press play in the Spotify player to listen.
    Use the button above to spin the record.
  </p>

  <div class="footer">MADE WITH ♡ AND MUSIC</div>
</main>

<script>
const vinyl = document.getElementById("vinyl");
const spinButton = document.getElementById("spinButton");
const status = document.getElementById("status");

let spinning = false;

spinButton.addEventListener("click", () => {
  spinning = !spinning;
  vinyl.classList.toggle("spinning", spinning);

  spinButton.textContent = spinning
    ? "STOP THE VINYL"
    : "SPIN THE VINYL ♫";

  status.textContent = spinning
    ? "♫ The record is spinning"
    : "♡ The record has stopped";
});
</script>

</body>
</html>
